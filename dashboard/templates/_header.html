<header class="border-b rule relative">
  <div class="max-w-[1440px] mx-auto px-10 h-16 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#b08a3e" stroke-width="0.7"/>
        <circle cx="16" cy="16" r="10" stroke="#b08a3e" stroke-width="0.4"/>
        <path d="M16 4 L16 28 M4 16 L28 16 M7 7 L25 25 M25 7 L7 25" stroke="#b08a3e" stroke-width="0.4"/>
        <circle cx="16" cy="16" r="2.5" fill="#8a2424" stroke="#d4a94d" stroke-width="0.5"/>
      </svg>
      <div class="leading-tight">
        <div class="font-display tracking-[0.2em] text-xl">ZILLAH</div>
        <div class="smallcaps text-[10px] text-gold">Storyteller's Codex</div>
      </div>
      {% if guild %}
      <div class="ml-6 pl-6 border-l rule">
        <div class="smallcaps text-[10px] text-bone-dim">Domain</div>
        <div class="font-script text-base text-bone">{{ guild.name }}</div>
      </div>
      {% endif %}
    </div>
    <nav class="flex items-center gap-7 text-sm text-bone-muted">
      {% if user %}
        {% if guild %}
        <a class="hover:text-bone smallcaps text-xs {% if active == 'kindred' %}gold-text{% endif %}" href="/g/{{ guild.id }}/kindred">Kindred</a>
        <a class="hover:text-bone smallcaps text-xs" href="#" data-toast="Drafts gallery — not yet wired">Drafts</a>
        <a class="hover:text-bone smallcaps text-xs" href="#" data-toast="Threads view — not yet wired">Threads</a>
        <a class="hover:text-bone smallcaps text-xs" href="#" data-toast="Chronicle settings — not yet wired">Chronicle</a>
        <span class="w-px h-5 bg-ink-700"></span>
        {% endif %}
        <span class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-full bg-gradient-to-br from-blood to-blood-deep border border-gold-dim flex items-center justify-center text-[10px] gold-bright">{{ user.username[0]|upper }}</span>
          <span class="text-bone-muted">{{ user.username }}</span>
        </span>
        <a class="hover:text-bone smallcaps text-xs text-bone-dim" href="/auth/logout">Sign out</a>
      {% else %}
        <a class="btn-ghost smallcaps text-[11px] px-4 py-2 rounded-sm" href="/auth/login">Enter the Codex</a>
      {% endif %}
    </nav>
  </div>
</header>
